<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEV Searcher — reorder the block, take the profit</title>
  <!-- SortableJS: drag & drop for the transaction boxes -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --panel-2: #1c2330;
      --line: #2a3242;
      --text: #e6edf3;
      --muted: #8b949e;
      --buy: #2ea043;   /* green = buy DOGE */
      --sell: #d9534f;  /* red   = sell DOGE */
      --victim: #b08800;/* amber = victim (mempool) */
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-rows: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------- Left sidebar: create new transactions ---------- */
    #sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    #sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
    #palette { display: flex; flex-direction: column; gap: 10px; }
    .hint { font-size: 11px; color: var(--muted); }

    /* ---------- Main column: graph / block / mempool ---------- */
    #main {
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      height: 100vh;
      min-height: 0;
    }
    .panel { border-bottom: 1px solid var(--line); padding: 12px 16px; min-height: 0; display: flex; flex-direction: column; }
    .panel > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }

    /* Graph area */
    #graph-panel { background: var(--panel-2); }
    #graph-wrap { position: relative; flex: 1; min-height: 0; }
    #graph { width: 100%; height: 100%; display: block; }

    /* Block-building area (the block the player submits) */
    #block-panel { background: var(--panel); }
    #block-area {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 8px;
      padding: 8px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      overflow-x: auto;
      min-height: 0;
    }
    #block-area:empty::after {
      content: "Drag transactions here to build the block  →  left-to-right = execution order";
      color: var(--muted);
      align-self: center;
      margin: auto;
      font-size: 13px;
    }

    /* Mempool (unordered victim transactions) */
    #mempool-panel { background: var(--panel); border-bottom: none; }
    #mempool {
      flex: 1;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      padding: 8px;
      background: rgba(0,0,0,.15);
      border-radius: 8px;
      overflow-y: auto;
      min-height: 0;
    }

    /* ---------- Transaction boxes ---------- */
    .txn {
      position: relative;
      min-width: 120px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
      background: var(--panel-2);
      cursor: grab;
      user-select: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,.3);
    }
    .txn:active { cursor: grabbing; }
    .txn .action { font-weight: 700; font-size: 13px; }
    .txn .owner { font-size: 11px; color: var(--muted); }
    .txn .amt { font-size: 12px; color: var(--text); }
    .txn.buy  { border-left: 4px solid var(--buy); }
    .txn.sell { border-left: 4px solid var(--sell); }
    .txn.victim { border-left-color: var(--victim); background: #241f10; }

    .txn .qty { width: 100%; margin-top: 4px; accent-color: var(--accent); cursor: pointer; }

    /* palette templates look like a "source" */
    .template { border-style: dashed; opacity: .95; }

    .sortable-ghost { opacity: .35; }
    .sortable-chosen { outline: 1px solid var(--accent); }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>Your transactions</h2>
    <div class="hint">Drag a template into the block to insert your own trade.</div>
    <div id="palette"><!-- templates injected by app.js --></div>
  </aside>

  <div id="main">
    <section id="graph-panel" class="panel">
      <h2>DOGE / USDC price — over the block</h2>
      <div id="graph-wrap">
        <!-- Canvas X axis lines up EXACTLY with the transaction boxes below. -->
        <canvas id="graph"></canvas>
      </div>
    </section>

    <section id="block-panel" class="panel">
      <h2>Block (execution order →)</h2>
      <div id="block-area"><!-- player-ordered transactions --></div>
    </section>

    <section id="mempool-panel" class="panel">
      <h2>Public mempool — unordered victim transactions</h2>
      <div id="mempool"><!-- victim transactions --></div>
    </section>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
