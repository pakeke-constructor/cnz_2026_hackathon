<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEV Searcher — reorder the block, take the profit</title>
  <!-- SortableJS: drag & drop for the transaction boxes -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --panel-2: #1c2330;
      --line: #2a3242;
      --text: #e6edf3;
      --muted: #8b949e;
      --buy: #2ea043;   /* green  = buy DOGE */
      --sell: #f0506e;  /* red    = sell DOGE */
      --victim: #ff8c1a;/* orange = victim (mempool) */
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-rows: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------- Left sidebar: create new transactions ---------- */
    #sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    #sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
    #palette { display: flex; flex-direction: column; gap: 10px; }
    .hint { font-size: 11px; color: var(--muted); }

    /* Inventory and execution controls */
    #inventory-box {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 240px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(14,17,22,.9);
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 40px -16px rgba(0,0,0,.9);
      z-index: 2;
    }
    #inventory-panel {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(28,35,48,.8);
    }
    #inventory-box h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    #inventory { display: flex; flex-direction: column; gap: 6px; }
    .inv-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--panel-2);
    }
    .inv-asset { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .inv-amt { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); }

    /* ---------- Main column: graph / block / mempool ---------- */
    #main {
      display: grid;
      grid-template-rows: 2fr 1fr 1fr;
      height: 100vh;
      min-height: 0;
    }
    .panel { border-bottom: 1px solid var(--line); padding: 12px 16px; min-height: 0; display: flex; flex-direction: column; }
    .panel > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }

    /* Graph area */
    #graph-panel { background: var(--panel-2); }
    #graph-wrap { position: relative; flex: 1; min-height: 0; }
    #graph { width: 100%; height: 100%; display: block; }

    /* Block-building area (the block the player submits) */
    #block-panel { background: var(--panel); }
    #block-area {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 8px;
      padding: 8px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      overflow-x: auto;
      min-height: 0;
    }
    #block-area:not(.has-txns)::after {
      content: "Drag transactions here to build the block  →  left-to-right = execution order";
      color: var(--muted);
      align-self: center;
      margin: auto;
      font-size: 13px;
    }

    /* Immovable spacer "boxes" that pad the block. They aren't transactions —
       they just give the price line a flat start (lead) and end (trail) region
       to ride across, so where the price starts and ends reads clearly.
       Pinned to the ends with flex `order`, so dragging never displaces them. */
    .spacer {
      flex: 0 0 96px;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px dashed var(--line);
      background: rgba(255,255,255,.02);
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      opacity: .7;
      cursor: default;
      user-select: none;
    }
    .spacer[data-spacer="lead"]  { order: -1; }
    .spacer[data-spacer="trail"] { order: 1; }

    /* Mempool (unordered victim transactions) */
    #mempool-panel { background: var(--panel); border-bottom: none; }
    #mempool {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      padding: 8px;
      background: rgba(0,0,0,.15);
      border-radius: 8px;
      overflow-y: auto;
      min-height: 0;
      border: 2px solid transparent;
      transition: background .12s ease, border-color .12s ease;
    }
    /* While dragging one of your own transactions, the mempool becomes a big
       red "drop to discard" zone. The overlay is pointer-events:none so the
       drop still lands on the mempool underneath. */
    #mempool.cancel-mode {
      background: rgba(240,80,110,.14);
      border-color: var(--sell);
    }
    #mempool.cancel-mode::after {
      content: "✕  drop here to cancel";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--sell);
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }

    /* ---------- Transaction boxes ---------- */
    .txn {
      --tone: var(--accent);                 /* per-side accent, set below */
      position: relative;
      min-width: 104px;
      padding: 9px 11px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.09);
      /* subtle vertical sheen + a faint wash of the side colour */
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 42%),
        linear-gradient(180deg, var(--panel-2), #141a24);
      cursor: grab;
      user-select: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
      transition: transform .1s ease, box-shadow .15s ease, border-color .15s ease;
    }
    /* left accent rail, drawn as a pseudo-element so it can glow */
    .txn::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--tone);
      box-shadow: 0 0 10px -1px var(--tone);
    }
    .txn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.18);
      box-shadow: 0 6px 16px -6px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;
    }
    .txn:active { cursor: grabbing; transform: translateY(0); }
    /* forceFallback drags a clone of .txn as the ghost; its inherited
       `transition: transform` would animate every per-frame reposition,
       making the ghost ease toward (and trail) the cursor. Snap it instead. */
    .sortable-fallback { transition: none !important; }

    /* header row: direction arrow + action label */
    .txn .action {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .txn .action::before {
      content: "▲";
      font-size: 9px;
      line-height: 1;
      color: var(--tone);
    }
    .txn.sell .action::before { content: "▼"; }

    /* owner rendered as a small pill */
    .txn .owner {
      align-self: flex-start;
      margin-top: 2px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.06);
      padding: 1px 6px;
      border-radius: 999px;
    }

    .txn.buy  { --tone: var(--buy); }
    .txn.sell { --tone: var(--sell); }

    /* Victim (mempool) — orange, with a warm tint so it clearly reads as prey */
    .txn.victim {
      --tone: var(--victim);
      border-color: rgba(255,140,26,.30);
      background:
        linear-gradient(180deg, rgba(255,140,26,.12), rgba(255,140,26,.03) 55%),
        linear-gradient(180deg, var(--panel-2), #141a24);
    }
    .txn.victim .action::before { color: var(--victim); }
    .txn.victim .owner {
      color: #ffc27a;
      background: rgba(255,140,26,.14);
      border-color: rgba(255,140,26,.28);
    }

    .txn .min-out {
      margin-top: 3px;
      font-size: 10px;
      font-weight: 700;
      color: var(--sell);
    }

    .txn .qty {
      width: 88px;
      margin-top: 6px;
      accent-color: var(--tone);
      cursor: pointer;
    }

    /* palette templates look like a "source" */
    .template {
      border-style: dashed;
      border-color: rgba(255,255,255,.16);
      opacity: .92;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    }
    .template:hover { opacity: 1; }

    .sortable-ghost { opacity: .3; }
    .sortable-chosen {
      box-shadow: 0 10px 24px -8px rgba(0,0,0,.7), 0 0 0 1px var(--accent) inset;
    }
    .sortable-drag { cursor: grabbing; }

    /* ---------- Execution controls ---------- */
    #controls { display: grid; grid-template-columns: 1fr; gap: 8px; padding-top: 10px; }
    #controls button {
      min-height: 42px;
      font: inherit;
      font-weight: 750;
      letter-spacing: .02em;
      color: var(--text);
      padding: 10px 8px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      cursor: pointer;
      transition: transform .1s ease, border-color .15s ease, background .15s ease;
    }
    #controls button:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.28); }
    #controls button:active { transform: translateY(0); }
    /* Must out-specify `#controls button` above (id+type beats a bare id),
       otherwise its panel-2 background overrides this green one. */
    #controls #btn-simulate { background: linear-gradient(180deg, #2ea043, #247d34); border-color: rgba(46,160,67,.7); }
    #controls #btn-simulate:hover { border-color: var(--buy); }
    body.playing #controls button { opacity: .5; pointer-events: none; }
    body.playing #block-area,
    body.playing #mempool,
    body.playing #palette { pointer-events: none; }

    /* live-exposure highlight on inventory rows holding a risky (non-USDC) asset */
    .inv-row.exposed {
      border-color: rgba(255,140,26,.45);
      background: rgba(255,140,26,.10);
    }
    .inv-row.exposed .inv-amt { color: #ffc27a; }

    /* ---------- Full-screen execution summary ---------- */
    #result {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5,8,12,.78);
      backdrop-filter: blur(8px);
      z-index: 20;
      animation: result-fade .2s ease-out;
    }
    #result.hidden { display: none; }
    .result-card {
      width: min(520px, 100%);
      padding: 28px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #161b22;
      box-shadow: 0 32px 100px rgba(0,0,0,.65);
      animation: result-pop .25s cubic-bezier(.2,.8,.2,1.1);
    }
    .result-win .result-card { border-color: rgba(46,160,67,.5); }
    .result-loss .result-card { border-color: rgba(240,80,110,.5); }
    @keyframes result-fade { from { opacity: 0; } }
    @keyframes result-pop { from { transform: translateY(10px) scale(.97); } }
    .result-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .result-hash { margin-top: 4px; font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--accent); }
    .result-profit { margin: 18px 0 20px; font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .result-win .result-profit { color: var(--buy); }
    .result-loss .result-profit { color: var(--sell); }
    .result-flat .result-profit { color: var(--text); }
    .result-grid { overflow: hidden; border: 1px solid var(--line); border-radius: 11px; }
    .result-row { display: flex; justify-content: space-between; gap: 20px; padding: 10px 13px; background: var(--panel-2); }
    .result-row + .result-row { border-top: 1px solid var(--line); }
    .result-row span { color: var(--muted); }
    .result-row strong { font-variant-numeric: tabular-nums; }
    .result-warn { margin-top: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,140,26,.30); background: rgba(255,140,26,.10); color: #ffc27a; font-size: 12px; line-height: 1.5; }
    #result button { width: 100%; margin-top: 18px; font: inherit; font-weight: 700; color: var(--text); padding: 11px 20px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
    #result button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>Your transactions</h2>
    <div class="hint">Drag a template into the block to insert your own trade.</div>
    <div id="palette"><!-- templates injected by app.js --></div>
  </aside>

  <div id="main">
    <section id="graph-panel" class="panel">
      <h2>Asset price over the block (USD)</h2>
      <div id="graph-wrap">
        <!-- Canvas X axis lines up EXACTLY with the transaction boxes below. -->
        <canvas id="graph"></canvas>
        <div id="inventory-box">
          <div id="inventory-panel">
            <h2>Your inventory</h2>
            <div id="inventory"><!-- balances injected by app.js --></div>
          </div>
          <div id="controls">
            <button id="btn-simulate" type="button">Simulate Block</button>
          </div>
        </div>
      </div>
    </section>

    <section id="block-panel" class="panel">
      <h2>Block (execution order →)</h2>
      <div id="block-area"><!-- player-ordered transactions --></div>
    </section>

    <section id="mempool-panel" class="panel">
      <h2>Public mempool — unordered victim transactions</h2>
      <div id="mempool"><!-- victim transactions --></div>
    </section>
  </div>

  <div id="result" class="hidden" role="dialog" aria-modal="true" aria-live="polite"></div>
  <!-- Classic script (NOT type="module"): ES modules are blocked over file://,
       so a module tag would leave the page blank when opened via run.bat. -->
  <script src="app.js" charset="utf-8"></script>
</body>
</html>
